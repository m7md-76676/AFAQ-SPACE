
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفاق | استكشف الكون</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#02030a;color:white;
 font-family:Arial,sans-serif;overflow:hidden
}
#space{position:fixed;inset:0}
canvas{display:block}
header{
 position:fixed;top:17px;right:18px;z-index:5;
 pointer-events:none
}
header h2{margin:0;color:#e8c77e;font-size:22px;letter-spacing:2px}
header p{font-size:11px;color:#aabbd1;margin:6px 0}
.panel{
 position:fixed;right:14px;top:88px;width:220px;
 padding:15px;background:#0b1424dd;
 border:1px solid #ffffff25;border-radius:16px;
 backdrop-filter:blur(12px);z-index:5
}
.panel h3{color:#e9c77c;margin:0 0 8px}
.panel p{font-size:12px;line-height:1.8;color:#d3dbea;margin:0}
#planetButtons{
 position:fixed;bottom:15px;left:0;right:0;
 z-index:6;display:flex;gap:8px;padding:10px;
 overflow-x:auto;justify-content:flex-start
}
button{
 color:white;background:#14243b;
 border:1px solid #ffffff30;border-radius:22px;
 padding:11px 15px;white-space:nowrap;font-size:12px
}
button:active{background:#96733b}
#home{
 position:fixed;top:18px;left:12px;z-index:6
}
#galaxy{
 position:fixed;top:62px;left:12px;z-index:6
}
#hint{
 position:fixed;bottom:75px;left:0;right:0;
 text-align:center;font-size:10px;color:#a6b5c9;
 pointer-events:none
}
@media(max-width:600px){
 .panel{width:185px;top:95px}
 header h2{font-size:19px}
}
</style>
</head>

<body>
<div id="space"></div>

<header>
 <h2>آفاق | AFAQ</h2>
 <p>رحلتك لاستكشاف أسرار الكون</p>
</header>

<div class="panel" id="info">
 <h3>مرحباً بك في آفاق 🌌</h3>
 <p>أنت الآن أمام النظام الشمسي. اختر كوكباً لتقترب منه وتتعرف على أسراره.</p>
</div>

<button id="home">النظام الشمسي</button>
<button id="galaxy">درب التبانة</button>

<div id="hint">اسحب لاستكشاف الفضاء • استخدم إصبعين للتقريب والإبعاد</div>
<div id="planetButtons"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02030a);
scene.fog=new THREE.FogExp2(0x02030a,0.0008);

const camera=new THREE.PerspectiveCamera(
 55,innerWidth/innerHeight,0.1,1800
);
camera.position.set(0,75,155);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
document.getElementById('space').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=7;
controls.maxDistance=350;
controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff,.65));

const sunLight=new THREE.PointLight(0xffffff,2200,600);
scene.add(sunLight);

const loader=new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');

function loadTexture(name){
 return loader.load(
  'https://www.solarsystemscope.com/textures/download/'+name
 );
}

// نجوم بأحجام مختلفة
const starPositions=[];
const starColors=[];
for(let i=0;i<6500;i++){
 const r=250+Math.random()*650;
 const theta=Math.random()*Math.PI*2;
 const phi=Math.acos(2*Math.random()-1);
 starPositions.push(
  r*Math.sin(phi)*Math.cos(theta),
  r*Math.cos(phi),
  r*Math.sin(phi)*Math.sin(theta)
 );
 const c=new THREE.Color().setHSL(
  .52+Math.random()*.18,.25,.65+Math.random()*.35
 );
 starColors.push(c.r,c.g,c.b);
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',
 new THREE.Float32BufferAttribute(starPositions,3));
starGeo.setAttribute('color',
 new THREE.Float32BufferAttribute(starColors,3));
const starField=new THREE.Points(starGeo,
 new THREE.PointsMaterial({
  size:1.25,vertexColors:true,transparent:true,
  opacity:.9,sizeAttenuation:true
 }));
scene.add(starField);

// مجرة درب التبانة: أذرع حلزونية ثلاثية الأبعاد
const galaxyGroup=new THREE.Group();
scene.add(galaxyGroup);
galaxyGroup.position.set(0,150,-300);
galaxyGroup.rotation.x=.45;

const galaxyPositions=[];
const galaxyColors=[];
const armCount=5;
const galaxyColor=new THREE.Color();

for(let i=0;i<16000;i++){
 const arm=i%armCount;
 const radius=Math.sqrt(Math.random())*95;
 const spin=radius*.075;
 const angle=arm/armCount*Math.PI*2+spin;
 const spread=(Math.random()-.5)*.28*radius/25;
 const x=Math.cos(angle)*radius+spread;
 const z=Math.sin(angle)*radius+spread;
 const y=(Math.random()-.5)*Math.max(2, radius*.12);
 galaxyPositions.push(x,y,z);
 const mix=Math.random();
 galaxyColor.setHSL(
  .58-mix*.38,.75,.45+Math.random()*.3
 );
 galaxyColors.push(galaxyColor.r,galaxyColor.g,galaxyColor.b);
}

const galaxyGeo=new THREE.BufferGeometry();
galaxyGeo.setAttribute('position',
 new THREE.Float32BufferAttribute(galaxyPositions,3));
galaxyGeo.setAttribute('color',
 new THREE.Float32BufferAttribute(galaxyColors,3));

const galaxyPoints=new THREE.Points(
 galaxyGeo,
 new THREE.PointsMaterial({
  size:.65,vertexColors:true,transparent:true,
  opacity:.8,depthWrite:false
 })
);
galaxyGroup.add(galaxyPoints);

const galaxyCore=new THREE.Mesh(
 new THREE.SphereGeometry(9,32,32),
 new THREE.MeshBasicMaterial({
  color:0xffd9a0,transparent:true,opacity:.22
 })
);
galaxyGroup.add(galaxyCore);

// الشمس
const sun=new THREE.Mesh(
 new THREE.SphereGeometry(7,64,64),
 new THREE.MeshBasicMaterial({
  map:loadTexture('2k_sun.jpg')
 })
);
scene.add(sun);

const sunGlow=new THREE.Sprite(
 new THREE.SpriteMaterial({
  map:createGlow(),color:0xffa52e,
  transparent:true,blending:THREE.AdditiveBlending,
  depthWrite:false
 })
);
sunGlow.scale.set(34,34,1);
sun.add(sunGlow);

function createGlow(){
 const canvas=document.createElement('canvas');
 canvas.width=256;canvas.height=256;
 const ctx=canvas.getContext('2d');
 const g=ctx.createRadialGradient(128,128,5,128,128,128);
 g.addColorStop(0,'rgba(255,240,180,0.8)');
 g.addColorStop(.2,'rgba(255,160,40,0.35)');
 g.addColorStop(1,'rgba(255,80,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
 const t=new THREE.CanvasTexture(canvas);
 return t;
}

// بيانات الكواكب
const data=[
 {name:'عطارد',en:'Mercury',size:1.3,orbit:13,speed:.9,tex:'2k_mercury.jpg',color:0xaaa9a5,desc:'أصغر كواكب المجموعة الشمسية وأقربها إلى الشمس. سطحه مليء بالفوهات.'},
 {name:'الزهرة',en:'Venus',size:2.1,orbit:20,speed:.65,tex:'2k_venus_surface.jpg',color:0xd5a36b,desc:'عالم شديد الحرارة، يحيط به غلاف جوي كثيف من ثاني أكسيد الكربون.'},
 {name:'الأرض',en:'Earth',size:2.3,orbit:29,speed:.5,tex:'2k_earth_daymap.jpg',color:0xffffff,desc:'كوكبنا الأزرق، موطن الحياة المعروف، وتغطي المياه معظم سطحه.'},
 {name:'المريخ',en:'Mars',size:1.8,orbit:39,speed:.38,tex:'2k_mars.jpg',color:0xffffff,desc:'الكوكب الأحمر، يضم أكبر بركان معروف في المجموعة الشمسية.'},
 {name:'المشتري',en:'Jupiter',size:5.2,orbit:55,speed:.23,tex:'2k_jupiter.jpg',color:0xffffff,desc:'أكبر كواكب المجموعة الشمسية، ويشتهر بالعاصفة الحمراء العظيمة.'},
 {name:'زحل',en:'Saturn',size:4.5,orbit:72,speed:.17,tex:'2k_saturn.jpg',color:0xffffff,desc:'عملاق غازي تحيط به حلقات ضخمة من الجليد والصخور والغبار.'},
 {name:'أورانوس',en:'Uranus',size:3.4,orbit:89,speed:.12,tex:'2k_uranus.jpg',color:0xffffff,desc:'عملاق جليدي أزرق مخضر، ويدور بمحور مائل بشكل استثنائي.'},
 {name:'نبتون',en:'Neptune',size:3.3,orbit:105,speed:.09,tex:'2k_neptune.jpg',color:0xffffff,desc:'أبعد الكواكب الرئيسية عن الشمس، وتشتهر أجواؤه برياح فائقة السرعة.'}
];

const planets=[];
const buttonArea=document.getElementById('planetButtons');

data.forEach((p,i)=>{
 // المدار
 const orbit=new THREE.Mesh(
  new THREE.RingGeometry(p.orbit-.045,p.orbit+.045,180),
  new THREE.MeshBasicMaterial({
   color:0x8394ad,transparent:true,opacity:.3,
   side:THREE.DoubleSide
  })
 );
 orbit.rotation.x=Math.PI/2;
 scene.add(orbit);

 // الكوكب
 const material=new THREE.MeshStandardMaterial({
  map:loadTexture(p.tex),
  color:p.color,roughness:.95
 });
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(p.size,64,64),material
 );
 scene.add(mesh);

 // غلاف جوي للأرض
 if(p.en==='Earth'){
  const atmosphere=new THREE.Mesh(
   new THREE.SphereGeometry(p.size*1.08,48,48),
   new THREE.MeshBasicMaterial({
    color:0x3e9fff,transparent:true,opacity:.13,
    side:THREE.BackSide
   })
  );
  mesh.add(atmosphere);
 }

 // حلقات زحل
 if(p.en==='Saturn'){
  const rings=new THREE.Mesh(
   new THREE.RingGeometry(p.size*1.3,p.size*2.15,128),
   new THREE.MeshStandardMaterial({
    color:0xcab58e,side:THREE.DoubleSide,
    transparent:true,opacity:.8
   })
  );
  rings.rotation.x=Math.PI/2.3;
  mesh.add(rings);
 }

 planets.push({
  mesh,p,angle:Math.random()*Math.PI*2
 });

 const b=document.createElement('button');
 b.textContent=p.name;
 b.onclick=()=>focusPlanet(mesh,p);
 buttonArea.appendChild(b);
});

// اختيار الكوكب
function focusPlanet(mesh,p){
 document.getElementById('info').innerHTML=
 '<h3>'+p.name+' | '+p.en+'</h3><p>'+p.desc+'</p>';
 const destination=mesh.position.clone();
 controls.target.copy(destination);
 camera.position.copy(destination).add(
  new THREE.Vector3(0,p.size*2.5,p.size*5+9)
 );
 controls.update();
}

// النقر على الكواكب
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(
  planets.map(x=>x.mesh)
 );
 if(hits.length){
  const found=planets.find(x=>x.mesh===hits[0].object);
  if(found)focusPlanet(found.mesh,found.p);
 }
});

// العودة للنظام الشمسي
document.getElementById('home').onclick=()=>{
 controls.target.set(0,0,0);
 camera.position.set(0,75,155);
 controls.update();
 document.getElementById('info').innerHTML=
 '<h3>النظام الشمسي ☀️</h3><p>ثمانية كواكب تدور حول نجمنا: الشمس. اختر أحدها لبدء الاستكشاف.</p>';
};

// الانتقال إلى المجرة
document.getElementById('galaxy').onclick=()=>{
 controls.target.copy(galaxyGroup.position);
 camera.position.set(0,185,-130);
 controls.update();
 document.getElementById('info').innerHTML=
 '<h3>درب التبانة 🌌</h3><p>مجرة حلزونية ضخمة تضم مئات المليارات من النجوم. يقع نظامنا الشمسي في أحد أذرعها.</p>';
};

// الحركة
function animate(){
 requestAnimationFrame(animate);
 const time=performance.now()*.00005;

 planets.forEach(({mesh,p,angle})=>{
  const a=angle+time*p.speed;
  mesh.position.set(
   Math.cos(a)*p.orbit,
   0,
   Math.sin(a)*p.orbit
  );
  mesh.rotation.y+=.002;
 });

 sun.rotation.y+=.001;
 galaxyGroup.rotation.y+=.00008;
 starField.rotation.y+=.000012;
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
