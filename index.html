
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفاق | رحلة النظام الشمسي</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#02040b;color:white;font-family:Arial,sans-serif;overflow:hidden}
#space{position:fixed;inset:0}
header{position:fixed;top:15px;right:18px;z-index:5}
header h2{margin:0;color:#e6c47a;letter-spacing:2px}
header p{margin:5px 0;color:#aebbd0;font-size:12px}
#info{position:fixed;z-index:5;top:90px;right:15px;width:220px;padding:15px;background:#101a2acc;border:1px solid #ffffff25;border-radius:15px;backdrop-filter:blur(10px)}
#info h2{margin:0 0 8px;color:#e9c77c}
#info p{font-size:13px;line-height:1.8;color:#d1d9e7;margin:0}
#planets{position:fixed;bottom:15px;left:0;right:0;z-index:5;display:flex;gap:8px;padding:10px;overflow-x:auto;justify-content:flex-start}
#planets button{flex-shrink:0;background:#15243a;color:white;border:1px solid #ffffff35;border-radius:20px;padding:11px 15px;font-size:13px}
#planets button:active{background:#b88b40}
#hint{position:fixed;bottom:75px;left:0;right:0;text-align:center;color:#aebbd0;font-size:11px;pointer-events:none}
#home{position:fixed;top:18px;left:15px;z-index:5;background:#17243a;color:white;border:1px solid #ffffff35;padding:10px 13px;border-radius:20px}
</style>
</head>

<body>
<div id="space"></div>

<header>
<h2>آفاق | AFAQ</h2>
<p>رحلة تفاعلية عبر النظام الشمسي</p>
</header>

<div id="info">
<h2>مرحباً بك في الفضاء</h2>
<p>اختر كوكباً من الأسفل لتبدأ استكشافه. يمكنك تدوير المشهد والتقريب بلمس الشاشة.</p>
</div>

<button id="home">المشهد الكامل</button>
<div id="hint">حرّك بإصبعك لاستكشاف الفضاء • قرّب بإصبعين</div>
<div id="planets"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040b);

const camera = new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,2000);
camera.position.set(0,85,155);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.getElementById('space').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.minDistance=12;
controls.maxDistance=260;
controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff,1.1));

const sunLight=new THREE.PointLight(0xffffff,1800,500);
scene.add(sunLight);

const textureLoader=new THREE.TextureLoader();

function texture(file){
 return textureLoader.load(
  'https://www.solarsystemscope.com/textures/download/'+file,
  undefined,undefined,()=>{}
 );
}

// النجوم
const starGeometry=new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<4500;i++){
 starPositions.push(
  (Math.random()-.5)*900,
  (Math.random()-.5)*500,
  (Math.random()-.5)*900
 );
}
starGeometry.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({
 color:0xffffff,size:0.8,transparent:true,opacity:.85
}));
scene.add(stars);

// الشمس
const sun=new THREE.Mesh(
 new THREE.SphereGeometry(7,64,64),
 new THREE.MeshBasicMaterial({map:texture('2k_sun.jpg'),color:0xffffff})
);
scene.add(sun);

const glow=new THREE.Mesh(
 new THREE.SphereGeometry(8.5,48,48),
 new THREE.MeshBasicMaterial({
  color:0xffa52c,transparent:true,opacity:.13,
  side:THREE.BackSide
 })
);
sun.add(glow);

const data=[
 {name:'عطارد',en:'Mercury',size:1.3,orbit:13,speed:.9,tex:'2k_mercury.jpg',color:0x999999,desc:'أقرب كواكب المجموعة الشمسية إلى الشمس، وسطحه مليء بالفوهات.'},
 {name:'الزهرة',en:'Venus',size:2.1,orbit:20,speed:.65,tex:'2k_venus_surface.jpg',color:0xd6a46c,desc:'كوكب شديد الحرارة، وله غلاف جوي كثيف.'},
 {name:'الأرض',en:'Earth',size:2.3,orbit:29,speed:.5,tex:'2k_earth_daymap.jpg',color:0x287bd1,desc:'موطننا الجميل، الكوكب المعروف بوجود الماء السائل والحياة.'},
 {name:'المريخ',en:'Mars',size:1.8,orbit:39,speed:.38,tex:'2k_mars.jpg',color:0xb65335,desc:'الكوكب الأحمر، ويتميز بسطحه الصخري وآثاره الجيولوجية.'},
 {name:'المشتري',en:'Jupiter',size:5.2,orbit:55,speed:.23,tex:'2k_jupiter.jpg',color:0xc99c72,desc:'أكبر كواكب المجموعة الشمسية، وتشتهر أجواؤه بالبقعة الحمراء العظيمة.'},
 {name:'زحل',en:'Saturn',size:4.5,orbit:72,speed:.17,tex:'2k_saturn.jpg',color:0xd6c095,desc:'عملاق غازي مشهور بحلقاته الواسعة المكونة من الجليد والصخور.'},
 {name:'أورانوس',en:'Uranus',size:3.4,orbit:89,speed:.12,tex:'2k_uranus.jpg',color:0x8ed9dc,desc:'عملاق جليدي يتميز بلونه الأزرق المخضر وميله المحوري الكبير.'},
 {name:'نبتون',en:'Neptune',size:3.3,orbit:105,speed:.09,tex:'2k_neptune.jpg',color:0x315ed5,desc:'كوكب أزرق بعيد، وتشتهر أجواؤه برياح شديدة السرعة.'}
];

const planets=[];
const buttons=document.getElementById('planets');

data.forEach((p,i)=>{
 const orbit=new THREE.Mesh(
  new THREE.RingGeometry(p.orbit-.07,p.orbit+.07,160),
  new THREE.MeshBasicMaterial({color:0x71849e,transparent:true,opacity:.27,side:THREE.DoubleSide})
 );
 orbit.rotation.x=Math.PI/2;
 scene.add(orbit);

 const material=new THREE.MeshStandardMaterial({
  map:texture(p.tex),color:p.color,roughness:.9
 });
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(p.size,48,48),material
 );
 scene.add(mesh);

 if(p.en==='Saturn'){
  const ring=new THREE.Mesh(
   new THREE.RingGeometry(p.size*1.35,p.size*2.1,100),
   new THREE.MeshBasicMaterial({color:0xc6ae85,side:THREE.DoubleSide,transparent:true,opacity:.75})
  );
  ring.rotation.x=Math.PI/2.35;
  mesh.add(ring);
 }

 planets.push({mesh,p,angle:Math.random()*Math.PI*2});

 const button=document.createElement('button');
 button.textContent=p.name;
 button.onclick=()=>selectPlanet(mesh,p);
 buttons.appendChild(button);
});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function selectPlanet(mesh,p){
 document.getElementById('info').innerHTML=
 `<h2>${p.name} | ${p.en}</h2><p>${p.desc}</p>`;
 controls.target.copy(mesh.position);
 camera.position.copy(mesh.position).add(new THREE.Vector3(0,8,p.size*5+9));
 controls.update();
}

renderer.domElement.addEventListener('click',e=>{
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(planets.map(x=>x.mesh));
 if(hits.length){
  const found=planets.find(x=>x.mesh===hits[0].object);
  if(found)selectPlanet(found.mesh,found.p);
 }
});

document.getElementById('home').onclick=()=>{
 controls.target.set(0,0,0);
 camera.position.set(0,85,155);
 controls.update();
 document.getElementById('info').innerHTML=
 '<h2>النظام الشمسي</h2><p>استكشف الكواكب الثمانية واكتشف أسرار الفضاء.</p>';
};

function animate(){
 requestAnimationFrame(animate);
 planets.forEach(({mesh,p,angle},i)=>{
  const a=angle+performance.now()*.00005*p.speed;
  mesh.position.set(Math.cos(a)*p.orbit,0,Math.sin(a)*p.orbit);
  mesh.rotation.y+=.003;
 });
 sun.rotation.y+=.001;
 stars.rotation.y+=.000015;
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
